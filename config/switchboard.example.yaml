# switchboard example configuration (Phase 1: GitHub, polling, one Ubuntu machine).
# Never write a token here. Tokens are read from the Secret Service by the name in token_ref.
# Default location: $XDG_CONFIG_HOME/switchboard/config.yaml (~/.config/switchboard/config.yaml).

version: 1

host:
  name: ubuntu-a                      # this machine; projects with the same host run here

secrets:
  allow_env: false                    # development only: also read SWITCHBOARD_TOKEN_<TOKEN_REF> from the environment

forges:
  github:
    token_ref: switchboard/github     # agent token: issues, pull requests, contents
    inbox_token_ref: switchboard/github-inbox   # your own identity: issues, pull requests and contents read/write (inbox, reply, merging from the web inbox)
    agent_identity: YOUR_GITHUB_USER  # the account the agent posts as (Phase 1: the same as yours)
    search_scope: "user:YOUR_GITHUB_USER"       # inbox search scope (org:NAME also works)
  # gitlab:                            # needed once a project is gl:
  #   base_url: https://gitlab.com      # the default; a self-managed GitLab goes here
  #   token_ref: switchboard/gitlab     # agent token: a fine-grained personal access token (GitLab 19.2+), else the api scope
  #   inbox_token_ref: switchboard/gitlab-inbox   # your own identity for the inbox, reply and merging (the api scope)
  #   agent_identity: YOUR_GITLAB_USER

trusted_authors:                      # accounts whose comments are taken as instructions
  github: [YOUR_GITHUB_USER]
  # gitlab: [YOUR_GITLAB_USER]

labels:
  ready: "agent:ready"
  plan: "agent:plan"                  # start with a plan to approve
  go: "agent:go"                      # start without a plan
  running: "agent:running"
  waiting: "agent:waiting"
  done: "agent:done"

comments:
  language: en                        # en | ja
  check_command: ""                   # optional command that checks a comment file before it is posted

claude:
  binary: claude
  auth: subscription                  # subscription | api_key (api_key passes ANTHROPIC_API_KEY through)

plan:
  approve_word: /ok                   # a trusted comment starting with it approves a plan

inbox:
  refresh_interval: 30s               # how often inbox serve reads the forges while a web page is open; at least 10s
  # project_root: ~/repos              # lets the web inbox add projects, cloned under this directory; off when unset
  # notify:                            # push notifications to the Android app (app/); off when unset
  #   fcm:
  #     project_id: YOUR_FIREBASE_PROJECT
  #     credentials_ref: switchboard/fcm # Secret Service name of the Firebase service account key (JSON)
# With inbox.auth, the web inbox asks for a GitLab login, and several people can share it (docs/GUIDE.md); the
# agents then need bots of their own, outside trusted_authors. Under inbox:
#   auth:
#     client_id: YOUR_GITLAB_APPLICATION_ID     # a confidential application: openid profile api, http://<listen>/auth/callback
#     client_secret_ref: switchboard/gitlab-oidc # Secret Service name of the application's secret
#     member_groups: [YOUR_GROUP]               # members of these GitLab groups (or a group below one) may log in
#     admin_groups: []                          # admins also edit the instructions and add projects
#     owner: YOUR_GITLAB_USER                   # an admin whatever their groups, and the only one on GitHub projects

agent:
  poll_interval: 60s
  timeout: 45m
  max_parallel: 1                     # runs at once on this host; read again without a restart
  max_turns: 80
  max_fix_attempts: 2                 # fix runs an issue gets from CI failures and rejected pushes; 0 turns them off
  limit_wait: 30m                     # how long to pause after a usage limit whose reset time is unknown
  retention: 720h                     # how long a run's directory (prompt.md, stream.jsonl) is kept; 0 keeps it forever
  # model: opus                       # the model of every run; empty leaves it to the CLI and your settings
  # effort: medium                    # low | medium | high | xhigh | max; empty leaves it to the CLI
  # plan: { model: "", effort: "" }   # overrides for the plan runs
  # fix: { model: "", effort: "" }    # overrides for the fix runs (CI, rejected pushes, conflicts)

# quota:                              # API cost caps of this host, in USD; used only with claude.auth: api_key
#   daily_usd: 20                     # local day; no run starts after the day's costs reach it, until midnight
#   monthly_usd: 300

projects:
  - ref: gh:YOUR_GITHUB_USER/switchboard-sandbox
    path: ~/repos/switchboard-sandbox
    host: ubuntu-a
    base_branch: main
    verify_command: ""                # empty: no verification, and the pull request says so
    include_untrusted: false          # true is refused for public repositories
    protected_paths_extra: []
    plan_first: never                 # how agent:ready starts: always (with a plan, as agent:plan), auto (with a plan unless the issue is clear), never (true and false still read as always and never)
    # max_parallel: 1                 # runs of this project at once, within agent.max_parallel; none when unset
    # icon: "🚀"                      # the web inbox's icon: an https:// image URL, an image file (/ or ~/), or one emoji; the forge's avatar when unset
  # - ref: gl:YOUR_GROUP/switchboard-sandbox   # gl:group/project, or gl:group/sub/project
  #   path: ~/repos/switchboard-sandbox-gl
  #   host: ubuntu-a
  #   token_ref: switchboard/gitlab-sandbox-bot   # optional, with agent_identity: the agent of this project only
  #   agent_identity: project_N_bot_XXXX          # posts as a project access token's bot; the inbox does not change
